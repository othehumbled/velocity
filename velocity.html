<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>velocity</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada+Big:ital,wght@0,400..700;1,400..700&family=Spline+Sans:wght@300..700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg:#05070f; --panel:#070b16; --surface:#0a1020;
    --text:#ffffff; --muted:#8b93a7; --dim:#5b6478;
    --edge:255 255 255;
    --line:rgba(255,255,255,.10);
    --line-soft:rgba(255,255,255,.06);
    --accent:#3b82f6; --accent-2:#60a5fa; --glow:#3b82f6;
    --accent-rgb:59 130 246; --accent2-rgb:96 165 250;
  }
  [data-theme="light"]{ --bg:#e6ebf2; --panel:#eef2f7; --surface:#ffffff; --text:#0b0f19; --muted:#475569; --dim:#64748b; --edge:11 15 25; --line:rgba(11,15,25,.12); --line-soft:rgba(11,15,25,.06); --accent:#2563eb; --accent-2:#3b82f6; --glow:#2563eb; --accent-rgb:37 99 235; --accent2-rgb:59 130 246; }
  [data-theme="red"]{ --bg:#14060a; --panel:#1c070c; --surface:#220a0f; --text:#ffffff; --muted:#b0a0a3; --dim:#7a6a6d; --edge:255 255 255; --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.06); --accent:#ef4444; --accent-2:#f87171; --glow:#ef4444; --accent-rgb:244 63 94; --accent2-rgb:248 113 113; }
  [data-theme="monochrome"]{ --bg:#0a0a0a; --panel:#111; --surface:#161616; --text:#fff; --muted:#9ca3af; --dim:#6b7280; --edge:255 255 255; --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.06); --accent:#d1d5db; --accent-2:#e5e7eb; --glow:#9ca3af; --accent-rgb:209 213 219; --accent2-rgb:148 163 184; }
  [data-theme="cherri"]{ --bg:#140a12; --panel:#1c0f18; --surface:#221420; --text:#fff; --muted:#c9a9c0; --dim:#8a6a80; --edge:255 255 255; --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.06); --accent:#f472b6; --accent-2:#f9a8d4; --glow:#f472b6; --accent-rgb:244 114 182; --accent2-rgb:251 207 232; }
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);font-family:"Spline Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;transition:background .35s ease,color .35s ease;}
  #bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;}
  svg{display:block;}

  .dock{position:fixed;left:0;top:0;bottom:0;width:60px;z-index:40;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;background:rgba(var(--edge),.025);backdrop-filter:blur(12px);border-right:1px solid var(--line-soft);}
  .dock .dicon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:12px;cursor:pointer;transition:.15s;}
  .dock .dicon:hover{background:rgba(var(--edge),.06);color:var(--text);border-color:var(--line);}
  .dock .dicon.active{color:var(--accent);background:rgba(var(--accent-rgb),.12);border-color:rgba(var(--accent-rgb),.4);}
  .dock .dicon svg{width:20px;height:20px;}
  .dock .dsep{flex:1;}

  header{position:fixed;top:0;left:60px;right:0;z-index:30;}
  .tabs{display:flex;align-items:center;gap:4px;padding:6px 8px 0;overflow:hidden;}
  .tabs-scroll{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;}
  .tabs-scroll::-webkit-scrollbar{display:none;}
  .tab{display:flex;align-items:center;gap:6px;min-width:120px;max-width:200px;height:32px;flex-shrink:0;padding:0 10px;border-radius:8px 8px 0 0;border:1px solid transparent;background:rgba(var(--edge),.02);color:var(--muted);font-size:12px;cursor:pointer;transition:.15s;}
  .tab:hover{background:rgba(var(--edge),.05);color:var(--text);}
  .tab.active{border-color:var(--line);background:rgba(var(--edge),.05);color:var(--text);}
  .tab .ticon{width:14px;height:14px;flex-shrink:0;color:var(--dim);}
  .tab.active .ticon{color:var(--accent);}
  .tab .tlabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tab .tclose{opacity:0;border:none;background:none;cursor:pointer;color:var(--dim);border-radius:4px;padding:2px;display:flex;}
  .tab:hover .tclose{opacity:1;}
  .tab .tclose:hover{background:rgba(var(--edge),.1);color:var(--text);}
  .tabbtn{flex-shrink:0;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:8px;padding:6px;transition:.15s;}
  .tabbtn:hover{background:rgba(var(--edge),.05);color:var(--text);}
  .chrome{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(var(--bg),.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft);}
  .wordmark{background:linear-gradient(to right,var(--text),var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-family:"Radio Canada Big",Georgia,serif;font-style:italic;font-size:16px;border:none;cursor:pointer;letter-spacing:.01em;}
  .nav{display:flex;align-items:center;gap:2px;}
  .nbtn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid transparent;background:none;cursor:pointer;border-radius:8px;color:var(--muted);transition:.15s;}
  .nbtn:hover{background:rgba(var(--edge),.05);color:var(--accent);border-color:var(--line-soft);}
  .nbtn:disabled{opacity:.25;cursor:default;}
  .nbtn:disabled:hover{background:none;color:var(--muted);border-color:transparent;}
  .omni{display:flex;align-items:center;gap:8px;flex:1;border:1px solid var(--line);background:rgba(var(--edge),.04);border-radius:999px;padding:8px 14px;transition:.2s;}
  .omni:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18);}
  .omni input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;min-width:0;}
  .omni input::placeholder{color:var(--dim);}
  .clock{font-family:"Roboto Mono",monospace;font-size:12px;color:var(--muted);padding:0 4px 0 8px;border-left:1px solid var(--line-soft);white-space:nowrap;}
  .dd{position:relative;flex-shrink:0;}
  .dd-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(var(--edge),.02);border-radius:999px;color:var(--muted);padding:6px 12px;font-size:12px;cursor:pointer;transition:.15s;}
  .dd-btn:hover{border-color:var(--accent);color:var(--text);}
  .dd-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 6px var(--glow);}
  .dd-chev{width:12px;height:12px;transition:transform .2s;}
  .dd.open .dd-chev{transform:rotate(180deg);}
  .dd-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:50;min-width:150px;border:1px solid var(--line);background:rgba(10,16,32,.97);backdrop-filter:blur(16px);border-radius:12px;padding:4px;box-shadow:0 10px 40px -10px rgba(0,0,0,.9);}
  [data-theme="light"] .dd-menu{background:rgba(255,255,255,.98);}
  .dd-item{display:flex;align-items:center;justify-content:space-between;width:100%;border:none;background:none;color:var(--muted);border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer;transition:.15s;text-align:left;}
  .dd-item:hover{background:rgba(var(--edge),.05);color:var(--text);}
  .dd-item.active{background:rgba(var(--accent),.15);color:var(--text);}
  .dd-item .dd-idot{width:6px;height:6px;border-radius:50%;background:var(--dim);}
  .dd-item.active .dd-idot{background:var(--accent-2);}
  .dd-item .dd-chk{width:12px;height:12px;color:var(--accent-2);}

  .viewport-wrap{position:fixed;left:60px;right:0;top:74px;bottom:0;z-index:10;padding:14px;}
  .viewport{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;border-radius:18px;background:transparent;}
  .game-chrome{display:flex;align-items:center;gap:8px;height:40px;flex-shrink:0;padding:0 12px;border-bottom:1px solid var(--line-soft);background:rgba(var(--bg),.72);backdrop-filter:blur(14px);border-radius:18px 18px 0 0;}
  .game-chrome[hidden]{display:none;}
  .game-chrome .gtitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500;color:var(--text);}
  .gbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line-soft);background:rgba(var(--edge),.02);color:var(--muted);cursor:pointer;border-radius:8px;padding:6px 10px;font-size:12px;transition:.15s;}
  .gbtn:hover{border-color:var(--line);color:var(--text);background:rgba(var(--edge),.05);}
  .frame-area{position:relative;flex:1;overflow:hidden;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .panel{position:absolute;inset:0;overflow:hidden;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .home-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;height:100%;overflow-y:auto;padding:40px 24px 80px;}
  .vel-logo{font-family:"Radio Canada Big",Georgia,serif;font-style:italic;font-size:68px;background:linear-gradient(to right,var(--text),var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;margin-bottom:6px;filter:drop-shadow(0 2px 32px var(--glow));transition:filter .35s ease;letter-spacing:.01em;line-height:1;}
  .vel-sub{font-size:13px;color:var(--dim);margin-bottom:28px;letter-spacing:.02em;}
  .vel-sub a{color:var(--accent-2);text-decoration:none;}
  .vel-sub a:hover{text-decoration:underline;}
  .search-form{width:100%;max-width:560px;transition:max-width .3s ease;}
  .search-box{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:rgba(var(--edge),.04);border-radius:999px;padding:14px 20px;backdrop-filter:blur(8px);transition:.2s;}
  .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.16);background:rgba(var(--edge),.06);}
  .search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;min-width:0;}
  .search-box input::placeholder{color:var(--muted);}
  .app-row{margin-top:34px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;max-width:680px;}
  .app-icon{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:.18s;background:none;border:none;color:var(--text);}
  .app-icon:hover{transform:translateY(-3px);}
  .app-icon .ring{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:rgba(var(--edge),.04);display:flex;align-items:center;justify-content:center;transition:.18s;backdrop-filter:blur(6px);}
  .app-icon:hover .ring{border-color:var(--accent);background:rgba(var(--accent-rgb),.12);box-shadow:0 6px 20px -8px rgba(var(--accent-rgb),.6);}
  .app-icon .ring img,.app-icon .ring svg{width:24px;height:24px;transition:.18s;}
  .app-icon:hover .ring img,.app-icon:hover .ring svg{transform:scale(1.12);}
  .app-icon span{font-size:11px;color:var(--muted);}
  .app-icon:hover span{color:var(--text);}
  .discord-cta{margin-top:30px;display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(88,101,242,.4);background:rgba(88,101,242,.12);color:#c9cdf7;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;transition:.18s;text-decoration:none;}
  .discord-cta:hover{background:rgba(88,101,242,.2);border-color:rgba(88,101,242,.6);transform:translateY(-2px);}
  .discord-cta svg{width:18px;height:18px;}
  .footer-ver{position:absolute;right:18px;bottom:14px;font-family:"Roboto Mono",monospace;font-size:10px;color:var(--dim);letter-spacing:.04em;}

  .lib-inner{display:flex;flex-direction:column;height:100%;padding:20px 24px;}
  .lib-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px;flex-shrink:0;}
  .lib-head h2{font-family:"Roboto Mono",monospace;font-size:13px;letter-spacing:.2em;color:var(--text);}
  .lib-count{font-size:12px;color:var(--muted);}
  .lib-controls{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .lib-controls select,.lib-controls .sbox{border:1px solid var(--line);background:rgba(var(--edge),.03);border-radius:10px;color:var(--muted);padding:8px 12px;font-size:13px;transition:.15s;}
  .lib-controls select:hover,.lib-controls .sbox:hover{border-color:var(--line);}
  .lib-controls select:focus,.lib-controls .sbox:focus-within{border-color:var(--accent);}
  .lib-controls .sbox{display:flex;align-items:center;gap:8px;}
  .lib-controls .sbox input{background:transparent;border:none;outline:none;color:var(--text);width:180px;font-size:13px;}
  .games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;overflow-y:auto;flex:1;min-height:0;align-content:start;align-items:start;padding-right:6px;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
  .games-grid::-webkit-scrollbar{width:8px;}
  .games-grid::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .gcard{position:relative;display:block;overflow:hidden;width:100%;aspect-ratio:3/4;min-height:200px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--edge),.04);cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;}
  .gcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 30px -12px rgba(0,0,0,.55);}
  .gcard img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;opacity:.94;transition:transform .3s,opacity .3s;background:linear-gradient(135deg,rgba(var(--accent-rgb),.3),rgba(var(--accent2-rgb),.25));}
  .gcard:hover img{transform:scale(1.05);opacity:1;}
  .gcard.no-cover img{visibility:hidden;}
  .gcard .ov{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 6%,rgba(0,0,0,.1) 45%,transparent 72%);pointer-events:none;}
  .gcard .gn{position:absolute;left:10px;right:10px;bottom:8px;font-size:13px;font-weight:600;line-height:1.25;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);z-index:2;}
  @media (max-width:800px){.games-grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;}.gcard{min-height:165px;}}
  @media (max-width:520px){.games-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}.gcard{min-height:150px;}.gcard .gn{font-size:11px;left:7px;right:7px;bottom:6px;}}
  .spinner{display:flex;flex:1;align-items:center;justify-content:center;color:var(--muted);padding:40px;font-size:14px;}
  .empty{padding:40px;text-align:center;color:var(--dim);font-size:14px;}

  .settings-inner{max-width:520px;margin:0 auto;padding:28px 20px;height:100%;overflow-y:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
  .settings-inner::-webkit-scrollbar{width:8px;}
  .settings-inner::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.set-head{margin-bottom:6px;}
.set-head h2{font-family:"Radio Canada Big",Georgia,serif;font-style:italic;font-size:32px;background:linear-gradient(to right,var(--text),var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;line-height:1.1;}
.set-head p{font-size:13px;color:var(--dim);margin-top:4px;}
.set-desc{font-size:12px;color:var(--muted);margin:-6px 0 14px;}
  .card{border:1px solid var(--line);background:rgba(var(--edge),.03);border-radius:16px;padding:18px;backdrop-filter:blur(8px);}
  .card h3{font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .card p{font-size:13px;line-height:1.55;color:var(--muted);margin-bottom:12px;}
  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .swatch{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:8px 4px;cursor:pointer;transition:.15s;background:rgba(var(--edge),.02);}
  .swatch.active{border-color:var(--accent);background:rgba(var(--accent-rgb),.12);}
  .swatch:hover{border-color:var(--accent-2);}
  .swatch .dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);}
  .swatch span{font-size:10px;color:var(--muted);}
  .bgopts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .bgopt{border:1px solid var(--line);background:rgba(var(--edge),.02);color:var(--muted);border-radius:12px;padding:10px;font-size:13px;cursor:pointer;transition:.15s;}
  .bgopt.active{border-color:var(--accent);background:rgba(var(--accent-rgb),.14);color:var(--text);}
  .bgopt:hover{border-color:var(--accent-2);color:var(--text);}
  .eng-row{display:flex;gap:8px;}
  .eng-btn{flex:1;border:1px solid var(--line);background:rgba(var(--edge),.02);color:var(--muted);border-radius:12px;padding:8px;cursor:pointer;font-size:13px;transition:.15s;}
  .eng-btn.active{border-color:var(--accent);background:rgba(var(--accent-rgb),.14);color:var(--text);}
  .eng-btn:hover{border-color:var(--accent-2);color:var(--text);}
  .loader-bar{position:absolute;top:0;left:0;height:2px;background:var(--accent);transition:width 1.1s ease;}
  [hidden]{display:none!important;}
</style>
<script type="module">
import * as sandstone from "https://cdn.jsdelivr.net/npm/sandstone-proxy@0.2.0/dist/sandstone.mjs";
window.sandstone = sandstone;
window.dispatchEvent(new Event("sandstone-loaded"));
</script>
</head>
<body>
<canvas id="bg"></canvas>

<aside class="dock" id="dock">
  <button class="dicon" id="dHome" title="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button>
  <button class="dicon" id="dLib" title="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="7" y2="11"/><line x1="15" x2="15.01" y1="11" y2="11"/><line x1="18" x2="18.01" y1="11" y2="11"/><path d="m17.32 5 1.6 3.1a2 2 0 0 0 1.5 1.1l3.4.5-2.5 2.4a2 2 0 0 0-.6 1.8l.6 3.4-3-1.6a2 2 0 0 0-1.9 0l-3 1.6.6-3.4a2 2 0 0 0-.6-1.8L9.5 9.7l3.4-.5a2 2 0 0 0 1.5-1.1L16 5"/></svg></button>
  <button class="dicon" id="dSet" title="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></button>
  <button class="dicon" id="dChg" title="changelog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 1 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg></button>

<script>

var THEMES=[{id:"dark",label:"dark",dot:"linear-gradient(135deg,#05070f,#3b82f6)"},{id:"light",label:"light",dot:"linear-gradient(135deg,#e2e8f0,#3b82f6)"},{id:"red",label:"crimson",dot:"linear-gradient(135deg,#14060a,#ef4444)"},{id:"monochrome",label:"mono",dot:"linear-gradient(135deg,#0a0a0a,#d1d5db)"},{id:"cherri",label:"cherri",dot:"linear-gradient(135deg,#140a12,#f472b6)"}];
var BACKGROUNDS=[{id:"meteor",label:"meteor shower"},{id:"aurora",label:"aurora waves"},{id:"stars",label:"starfield"},{id:"none",label:"solid"}];
function getTheme(){return localStorage.getItem("vel_theme")||"cherri";}
function setThemeT(t){localStorage.setItem("vel_theme",t);document.documentElement.setAttribute("data-theme",t);}
function getBg(){return localStorage.getItem("vel_background")||"meteor";}
function setBgT(b){localStorage.setItem("vel_background",b);velBg=b;initBg();}
var velBg=getBg();
setThemeT(getTheme());

var ENGINES={brave:{label:"Brave",url:"https://search.brave.com/search?q="},ddg:{label:"DuckDuckGo",url:"https://duckduckgo.com/?q="},google:{label:"Google",url:"https://www.google.com/search?q="}};
function getEngine(){return localStorage.getItem("vel_engine")||"brave";}
function setEngine(e){localStorage.setItem("vel_engine",e);}
function normalize(q){
  var eng=getEngine();q=(q||"").trim();
  if(!q)return ENGINES[eng].url;
  if(/^https?:\/\//i.test(q))return q;
  if(/^[\w-]+(\.[\w-]+)+/.test(q))return "https://"+q;
  return ENGINES[eng].url+encodeURIComponent(q);
}


var RH_FALLBACKS=[{url:"https://demo-opensource.rammerhead.org",pwd:"sharkie4life"},
  {url:"https://direct2.rammerhead.org"},
  {url:"https://cloudflare.rammerhead.org"},
  {url:"https://coolsharks.info"},
  {url:"https://staff.mordeco.com"}
];
var rhInstance="",rhSession="",rhReady=false,rhTrying=false;
function rhCandidates(){
  var list=[];
  try{if(/^https?:/.test(location.origin))list.push({url:location.origin,pwd:""});}catch(e){}
  RH_FALLBACKS.forEach(function(f){
    var seen=false;list.forEach(function(l){if(l.url===f.url)seen=true;});
    if(!seen)list.push(f);
  });
  return list;
}
function rhNeedPwd(inst){
  return fetch(inst.url+"/needpassword",{cache:"no-store"}).then(function(r){return r.text();}).then(function(t){t=t.trim();return (t==="true"||t==="false")?(t==="true"):null;}).catch(function(){return null;});
}
function rhCreate(inst){
  var qs="";
  if(inst.needPwd&&inst.pwd)qs="?pwd="+encodeURIComponent(inst.pwd);
  return fetch(inst.url+"/newsession"+qs,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("newsession "+r.status);return r.text();}).then(function(t){var id=t.trim();if(/^[a-f0-9]{32}$/i.test(id))return id;throw new Error("bad session id");});
}
async function initRH(){
  if(rhTrying||rhReady)return;rhTrying=true;
  var cands=rhCandidates();
  for(var i=0;i<cands.length;i++){
    var c=cands[i];
    try{
      var np=await rhNeedPwd(c);
      if(np===null)continue;
      c.needPwd=np;
      var id=await rhCreate(c);
      rhInstance=c.url;rhSession=id;rhReady=true;break;
    }catch(e){}
  }
  rhTrying=false;
}
function proxify(url,isGame){
  if(isGame)return url;
  return url;
}

var sandstone=null,sandstoneProxy=null,sandstoneFrame=null,sandstoneReady=false,sandstonePending=null;
var USE_SANDSTONE=false;
var WISP_FALLBACKS=["wss://wisp.mercurywork.shop/","wss://wisp.mercurywork.org/","wss://wispmirror.mercurywork.shop/"];
function sandstoneSetWisp(i){
  if(!sandstone||!sandstone.libcurl||!WISP_FALLBACKS[i])return;
  try{sandstone.libcurl.set_websocket(WISP_FALLBACKS[i]);}catch(e){}
}
function initSandstone(){
  if(!window.sandstone||sandstoneReady)return;
  sandstone=window.sandstone;
  try{
    sandstoneProxy=new sandstone.controller.ProxyFrame();
    sandstoneProxy.on_load=function(){var at=activeTab();if(at&&at.kind==="web"&&!at.isGame){at.loading=false;updateLoader();}};
    sandstoneProxy.on_url_change=function(){var at=activeTab();if(at&&at.kind==="web"&&!at.isGame)updateChrome();};
    sandstoneSetWisp(0);
    sandstoneFrame=sandstoneProxy.iframe;
    sandstoneFrame.style.cssText="position:absolute;inset:0;width:100%;height:100%;border:0;display:none;";
    frameArea.appendChild(sandstoneFrame);
    sandstoneReady=true;
    if(sandstonePending){var p=sandstonePending;sandstonePending=null;if(activeTab()&&activeTab().id===p.id)sandstoneNav(p);}
  }catch(e){console.warn("sandstone init failed",e);}
}
function sandstoneNav(tab){
  if(!sandstoneReady){sandstonePending=tab;return;}
  if(!sandstoneProxy||!tab||!tab.history||tab.idx<0)return;
  if(activeTab()&&activeTab().id===tab.id){
    tab.loading=true;updateLoader();
    try{sandstoneProxy.navigate_to(tab.history[tab.idx].url);}catch(e){console.warn(e);}
  }
}
window.addEventListener("sandstone-loaded",initSandstone);
if(window.sandstone)initSandstone();

function buildEngineDD(){
  var menu=document.getElementById("engineDDMenu");menu.innerHTML="";
  Object.keys(ENGINES).forEach(function(k){
    var active=getEngine()===k;
    var b=document.createElement("button");b.type="button";b.className="dd-item"+(active?" active":"");b.dataset.eng=k;
    b.innerHTML='<span style="display:flex;align-items:center;gap:8px"><span class="dd-idot"></span>'+ENGINES[k].label+'</span>'+(active?'<svg class="dd-chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':'');
    b.onclick=function(){setEngine(k);document.getElementById("engineDDLabel").textContent=ENGINES[k].label;document.getElementById("engineDD").classList.remove("open");menu.hidden=true;buildEngineDD();};
    menu.appendChild(b);
  });
}
var engineDD=document.getElementById("engineDD");
document.getElementById("engineDDBtn").onclick=function(e){e.stopPropagation();var m=document.getElementById("engineDDMenu");var open=!engineDD.classList.contains("open");engineDD.classList.toggle("open",open);m.hidden=!open;};
document.addEventListener("mousedown",function(e){if(!engineDD.contains(e.target)){engineDD.classList.remove("open");document.getElementById("engineDDMenu").hidden=true;}});
buildEngineDD();
document.getElementById("engineDDLabel").textContent=ENGINES[getEngine()].label;

function tick(){var d=new Date();var h=String(d.getHours()).padStart(2,"0");var m=String(d.getMinutes()).padStart(2,"0");document.getElementById("clock").textContent=h+":"+m;}
tick();setInterval(tick,10000);

function syncDock(){
  var at=activeTab();
  document.getElementById("dHome").classList.toggle("active",at&&at.kind==="home");
  document.getElementById("dLib").classList.toggle("active",at&&at.kind==="library");
  document.getElementById("dSet").classList.toggle("active",at&&at.kind==="settings");
  document.getElementById("dChg").classList.toggle("active",at&&at.kind==="changelog");
}
function openKind(kind){var ex=tabs.find(function(t){return t.kind===kind;});if(ex){setActive(ex.id);}else{addTab(kind);}}
document.getElementById("dHome").onclick=function(){openKind("home");};
document.getElementById("dLib").onclick=function(){openKind("library");};
document.getElementById("dSet").onclick=function(){openKind("settings");};
document.getElementById("dChg").onclick=function(){openKind("changelog");};

var _id=0;function nid(){return ++_id;}
function makeTab(kind,opts){opts=opts||{};return{id:nid(),kind:kind,isGame:!!opts.isGame,title:opts.title||(kind==="home"?"new tab":kind==="library"?"library":kind==="settings"?"settings":"changelog"),history:[],idx:-1,src:"about:blank",reload:0,loading:false};}
var tabs=[makeTab("home")],activeId=tabs[0].id;
var frameArea=document.getElementById("frameArea"),iframeEls={};
function activeTab(){return tabs.find(function(t){return t.id===activeId;});}
function iconFor(kind){
  if(kind==="home")return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>';
  if(kind==="library")return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="7" y2="11"/><line x1="15" x2="15.01" y1="11" y2="11"/><line x1="18" x2="18.01" y1="11" y2="11"/><path d="m17.32 5 1.6 3.1a2 2 0 0 0 1.5 1.1l3.4.5-2.5 2.4a2 2 0 0 0-.6 1.8l.6 3.4-3-1.6a2 2 0 0 0-1.9 0l-3 1.6.6-3.4a2 2 0 0 0-.6-1.8L9.5 9.7l3.4-.5a2 2 0 0 0 1.5-1.1L16 5"/></svg>';
  if(kind==="settings")return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>';
  if(kind==="changelog")return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 1 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>';
  return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><circle cx="12" cy="12" r="10"/></svg>';
}
function renderTabs(){
  var sc=document.getElementById("tabsScroll");sc.innerHTML="";
  tabs.forEach(function(t){
    var d=document.createElement("div");d.className="tab"+(t.id===activeId?" active":"");
    d.innerHTML='<span class="ticon">'+iconFor(t.kind)+'</span><span class="tlabel"></span>';
    d.querySelector(".tlabel").textContent=t.title;
    if(tabs.length>1){var x=document.createElement("button");x.className="tclose";x.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';x.onclick=function(e){e.stopPropagation();closeTab(t.id);};d.appendChild(x);}
    d.onclick=function(){setActive(t.id);};
    d.addEventListener("mousedown",function(e){if(e.button===1){e.preventDefault();closeTab(t.id);}});
    sc.appendChild(d);
  });
}
function addTab(kind,opts){var t=makeTab(kind,opts);tabs.push(t);setActive(t.id);}
function closeTab(id){
  var i=tabs.findIndex(function(t){return t.id===id;});if(i<0)return;
  var ns=tabs.filter(function(t){return t.id!==id;});
  if(iframeEls[id]){iframeEls[id].remove();delete iframeEls[id];}
  if(ns.length===0){var nt=makeTab("home");tabs=[nt];setActive(nt.id);return;}
  tabs=ns;
  if(id===activeId){setActive(ns[Math.min(i,ns.length-1)].id);}else{renderTabs();renderFrame();syncDock();}
}
function setActive(id){activeId=id;renderTabs();renderFrame();updateChrome();syncDock();}
function ensureIframe(t){
  if(iframeEls[t.id])return iframeEls[t.id];
  var f=document.createElement("iframe");
  f.title=t.title;f.style.display="none";
  f.onload=function(){t.loading=false;if(activeId===t.id)updateLoader();};
  frameArea.appendChild(f);iframeEls[t.id]=f;return f;
}
function setIframeSrc(t){var f=ensureIframe(t);if(t.reload){f.src="about:blank";setTimeout(function(){f.src=t.src;},0);}else{f.src=t.src;}}
function renderFrame(){
  tabs.forEach(function(t){var f=iframeEls[t.id];if(f)f.style.display="none";});
  var at=activeTab();
  var proxied=USE_SANDSTONE&&at&&at.kind==="web"&&!at.isGame;
  if(sandstoneFrame)sandstoneFrame.style.display=(proxied&&sandstoneReady)?"block":"none";
  if(proxied){
    if(sandstoneReady){sandstoneNav(at);}
    else{var f=ensureIframe(at);f.style.display="block";if(at.src)setIframeSrc(at);}
  }else if(at&&at.kind==="web"){
    var wf=ensureIframe(at);wf.style.display="block";
    if(at.src && (wf.src==="" || wf.src==="about:blank")) setIframeSrc(at);
  }
  var existing=document.getElementById("curPanel");if(existing)existing.remove();
  if(at&&at.kind!=="web"){
    var p=document.createElement("div");p.className="panel";p.id="curPanel";
    if(at.kind==="home")p.innerHTML=homeHTML();
    else if(at.kind==="library")p.innerHTML=libHTML();
    else if(at.kind==="settings")p.innerHTML=settingsHTML();
    else if(at.kind==="changelog")p.innerHTML=changelogHTML();
    frameArea.appendChild(p);
    if(at.kind==="home")wireHome();
    if(at.kind==="library")wireLib();
    if(at.kind==="settings")wireSettings();
    if(at.kind==="changelog")wireChg();
  }
  document.getElementById("gameChrome").hidden=!(at&&at.kind==="web"&&at.isGame);
  if(at&&at.kind==="web"&&at.isGame)document.getElementById("gameTitle").textContent=at.title;
  updateLoader();
}
function updateLoader(){var at=activeTab();var l=document.getElementById("loader");if(at&&at.kind==="web"&&at.loading){l.hidden=false;l.style.width="0%";requestAnimationFrame(function(){l.style.width="85%";});}else{l.hidden=true;l.style.width="100%";}}
function navigate(rawUrl,opts){
  opts=opts||{};var target=normalize(rawUrl);var isGame=!!opts.isGame;
  tabs=tabs.map(function(t){if(t.id!==activeId)return t;var h=t.history.slice(0,t.idx+1);h.push({url:target,title:opts.title||target});return{id:t.id,kind:"web",isGame:isGame,title:opts.title||target,history:h,idx:h.length-1,src:target,reload:0,loading:true};});
  var at=activeTab();
  if(isGame||!USE_SANDSTONE){setIframeSrc(at);}else{sandstoneNav(at);}
  renderTabs();renderFrame();updateChrome();syncDock();
}
function openGame(game){var t=makeTab("web",{isGame:true,title:game.name});t.history=[{url:game.url,title:game.name}];t.idx=0;t.src=game.url;t.loading=true;tabs.push(t);setActive(t.id);var f=ensureIframe(t);setIframeSrc(t);}
function back(){tabs=tabs.map(function(t){if(t.id!==activeId||t.idx<=0)return t;var ni=t.idx-1,h=t.history[ni];return{id:t.id,kind:t.kind,isGame:t.isGame,title:h.title,history:t.history,idx:ni,src:h.url,reload:0,loading:true};});var at=activeTab();if(at&&at.kind==="web"){if(at.isGame||!USE_SANDSTONE)setIframeSrc(at);else sandstoneNav(at);}renderFrame();updateChrome();}

function wireLib(){
  var grid=document.getElementById("libGrid"),count=document.getElementById("libCount"),search=document.getElementById("libSearch"),sort=document.getElementById("libSort");
  function render(){
    var f=(search.value||"").trim().toLowerCase();
    var list=GAMES.filter(function(g){return!f||g.name.toLowerCase().indexOf(f)!==-1;});
    list.sort(sort.value==="id"?function(a,b){return a.id-b.id;}:function(a,b){return a.name.localeCompare(b.name);});
    count.textContent=list.length+" games";
    grid.innerHTML="";
    if(!list.length){grid.innerHTML='<div class="empty">No games found.</div>';return;}
    var df=document.createDocumentFragment();
    list.forEach(function(g){
      var d=document.createElement("div");d.className="gcard";
      d.innerHTML='<img loading="lazy" alt=""><div class="ov"></div><div class="gn"></div>';
      var img=d.querySelector("img");img.src=g.cover;img.onerror=function(){this.style.visibility="hidden";d.classList.add("no-cover");};d.querySelector(".gn").textContent=g.name;
      d.onclick=function(){openGame(g);};
      df.appendChild(d);
    });
    grid.appendChild(df);
  }
  render();
  search.oninput=render;sort.onchange=render;
}

document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();document.getElementById("omniInput").focus();document.getElementById("omniInput").select();}});

var bgRaf=0,bgRunning=false;
function initBg(){
  cancelAnimationFrame(bgRaf);bgRunning=false;
  if(velBg==="none")return;
  var canvas=document.getElementById("bg"),ctx=canvas.getContext("2d");
  var dpr=Math.min(window.devicePixelRatio||1,2),w=0,h=0,last=performance.now(),t=0;
  var stars=[],meteors=[],sparks=[],blobs=[],mt=800;
  function rand(a,b){return a+Math.random()*(b-a);}
  function readAccent(){var s=getComputedStyle(document.documentElement);function p(v,fb){var x=s.getPropertyValue(v).trim();return x?x.split(/\s+/).map(Number):fb;}return{a:p("--accent-rgb",[59,130,246]),a2:p("--accent2-rgb",[96,165,250])};}
  var accent=readAccent();
  var showMeteors=velBg==="meteor",showAurora=velBg==="meteor"||velBg==="aurora";
  function colA(al){return"rgba("+accent.a[0]+","+accent.a[1]+","+accent.a[2]+","+al+")";}
  function colA2(al){return"rgba("+accent.a2[0]+","+accent.a2[1]+","+accent.a2[2]+","+al+")";}
  function colW(al){return"rgba(255,255,255,"+al+")";}
  function init(){var n=Math.min(170,Math.max(70,Math.floor(w*h/12500)));stars=[];for(var i=0;i<n;i++){var d=Math.random();stars.push({x:Math.random()*w,y:Math.random()*h,r:d<0.82?rand(0.5,1.1):rand(1.4,2.6),base:rand(0.25,0.7),phase:Math.random()*Math.PI*2,speed:rand(0.4,1.6),vx:(Math.random()-0.5)*0.04*(0.5+d),vy:(Math.random()-0.5)*0.04*(0.5+d)});}var R=Math.max(w,h);blobs=[{x:w*0.22,y:h*0.3,r:R*0.42,vx:0.012,vy:0.007},{x:w*0.8,y:h*0.72,r:R*0.46,vx:-0.01,vy:-0.006},{x:w*0.55,y:h*0.5,r:R*0.33,vx:0.008,vy:-0.009}];}
  function resize(){w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=Math.max(1,w*dpr);canvas.height=Math.max(1,h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);init();}
  function spawn(){var fl=Math.random()<0.5,fire=Math.random()<0.15,big=fire&&Math.random()<0.4,useA2=Math.random()<0.5;meteors.push({x:fl?rand(-220,-60):rand(w+60,w+220),y:rand(-220,-40),len:big?rand(240,360):fire?rand(180,280):rand(100,200),speed:big?rand(11,16):fire?rand(9,13):rand(6,11),angle:fl?rand(Math.PI/7,Math.PI/3.2):Math.PI-rand(Math.PI/7,Math.PI/3.2),width:big?rand(2.6,3.6):fire?rand(2,2.8):rand(1,1.6),fire:fire,big:big,useA2:useA2,life:1,flash:fire?1:0});}
  function frame(now){if(!bgRunning)return;var dt=Math.min((now-last)/16.67,3);last=now;t+=dt;ctx.clearRect(0,0,w,h);
    for(var b=0;b<blobs.length;b++){var bl=blobs[b];bl.x+=bl.vx*dt;bl.y+=bl.vy*dt;if(bl.x<-bl.r)bl.x=w+bl.r;else if(bl.x>w+bl.r)bl.x=-bl.r;if(bl.y<-bl.r)bl.y=h+bl.r;else if(bl.y>h+bl.r)bl.y=-bl.r;var g=ctx.createRadialGradient(bl.x,bl.y,0,bl.x,bl.y,bl.r);g.addColorStop(0,colA(0.05));g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(bl.x,bl.y,bl.r,0,Math.PI*2);ctx.fill();}
    if(showAurora){for(var r=0;r<3;r++){var by=h*(0.55+r*0.13),amp=50+r*18;ctx.beginPath();for(var x=0;x<=w;x+=8){var y=by+Math.sin(x*0.0035+t*0.006+r*1.7)*amp+Math.sin(x*0.011+t*0.009)*14;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();var ag=ctx.createLinearGradient(0,by-amp,0,h);ag.addColorStop(0,colA2(0.11-r*0.025));ag.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=ag;ctx.fill();}}
    for(var i=0;i<stars.length;i++){var s=stars[i];s.phase+=0.02*s.speed*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.x<0)s.x+=w;else if(s.x>w)s.x-=w;if(s.y<0)s.y=h;else if(s.y>h)s.y-=h;var op=Math.max(0,Math.min(1,s.base+Math.sin(s.phase)*0.35));ctx.fillStyle=colW(op);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();if(s.r>1.6){var sp=op*0.5,L=s.r*3.2;ctx.strokeStyle=colA2(sp);ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(s.x-L,s.y);ctx.lineTo(s.x+L,s.y);ctx.moveTo(s.x,s.y-L);ctx.lineTo(s.x,s.y+L);ctx.stroke();}}
    var md=115,md2=md*md;for(var a=0;a<stars.length;a++){var sa=stars[a];for(var b2=a+1;b2<stars.length;b2++){var sb=stars[b2];var dx=sa.x-sb.x,dy=sa.y-sb.y,d2=dx*dx+dy*dy;if(d2<md2){var al=(1-Math.sqrt(d2)/md)*0.12;ctx.strokeStyle=colA(al);ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(sa.x,sa.y);ctx.lineTo(sb.x,sb.y);ctx.stroke();}}}
    if(showMeteors){
      mt-=dt*16.67;if(mt<=0){spawn();mt=rand(1600,3400);}
      meteors=meteors.filter(function(m){return m.life>0;});
      for(var mi=0;mi<meteors.length;mi++){var m=meteors[mi];m.x+=Math.cos(m.angle)*m.speed*dt;m.y+=Math.sin(m.angle)*m.speed*dt;var tx=m.x-Math.cos(m.angle)*m.len,ty=m.y-Math.sin(m.angle)*m.len;var head=m.useA2?colA2:colA;
        var g1=ctx.createLinearGradient(m.x,m.y,tx,ty);g1.addColorStop(0,head(0.22));g1.addColorStop(1,head(0));ctx.strokeStyle=g1;ctx.lineWidth=m.width*3.5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tx,ty);ctx.stroke();
        var g2=ctx.createLinearGradient(m.x,m.y,tx,ty);g2.addColorStop(0,colW(0.95));g2.addColorStop(0.3,head(0.85));g2.addColorStop(1,head(0));ctx.strokeStyle=g2;ctx.lineWidth=m.width;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tx,ty);ctx.stroke();
        var hr=m.width*6,hg=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,hr);hg.addColorStop(0,head(0.9));hg.addColorStop(0.4,head(0.3));hg.addColorStop(1,head(0));ctx.fillStyle=hg;ctx.beginPath();ctx.arc(m.x,m.y,hr,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=colW(0.98);ctx.beginPath();ctx.arc(m.x,m.y,m.width*0.6,0,Math.PI*2);ctx.fill();
        if((m.fire||m.big)&&Math.random()<0.4){sparks.push({x:m.x,y:m.y,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2+0.8,life:1,r:rand(0.6,1.6),useA2:m.useA2});}
        if(m.fire&&m.flash>0){m.flash-=0.035*dt;var fr=(1-m.flash)*(m.big?60:42);ctx.strokeStyle=colA2(m.flash*0.4);ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(m.x,m.y,fr,0,Math.PI*2);ctx.stroke();if(m.big){ctx.strokeStyle=colA(m.flash*0.2);ctx.lineWidth=1;ctx.beginPath();ctx.arc(m.x,m.y,fr*1.5,0,Math.PI*2);ctx.stroke();}}
        if(m.x<-400||m.x>w+400||m.y>h+400)m.life=0;
      }
      sparks=sparks.filter(function(s){return s.life>0;});
      for(var si=0;si<sparks.length;si++){var sp=sparks[si];sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;sp.vy+=0.03*dt;sp.life-=0.025*dt;var c=sp.useA2?colA2:colA;ctx.fillStyle=c(Math.max(0,sp.life));ctx.beginPath();ctx.arc(sp.x,sp.y,sp.r,0,Math.PI*2);ctx.fill();}
    }
    bgRaf=requestAnimationFrame(frame);
  }
  function vis(){if(document.hidden){bgRunning=false;cancelAnimationFrame(bgRaf);}else if(!bgRunning){bgRunning=true;last=performance.now();bgRaf=requestAnimationFrame(frame);}}
  resize();window.addEventListener("resize",resize);document.addEventListener("visibilitychange",vis);
  bgRunning=true;bgRaf=requestAnimationFrame(frame);
}

renderTabs();renderFrame();updateChrome();syncDock();initBg();
</script>
